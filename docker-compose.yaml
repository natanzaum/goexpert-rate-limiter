services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      RATE_LIMIT_IP: "10"
      RATE_LIMIT_BLOCK_TIME: "5m"
      API_KEY_HEADER: "API_KEY"
      RATE_LIMIT_TOKENS: '{"token-100":100,"token-50":50}'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data: